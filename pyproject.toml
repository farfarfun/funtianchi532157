[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funtianchi532157"
version = "0.1.0"
description = "Data processing, language model training, and evaluation workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "accelerate>=0.17.1",
    "datasets>=2.0.0",
    "deepspeed>=0.9.0",
    "farlog>=0.1.0",
    "funget>=1.1.69",
    "numpy>=1.24",
    "peft>=0.2.0",
    "py-data-juicer>=1.6.0",
    "sentencepiece>=0.1.99",
    "torch>=2.13.0",
    "transformers>=4.33.1",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/farfarfun/funtianchi532157"

[tool.hatch.build.targets.wheel]
packages = ["funtianchi532157"]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
